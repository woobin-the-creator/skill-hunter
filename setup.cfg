[metadata]
name = skill-hunter
version = attr: skill_hunter.__version__
description = Dependency-aware Agent Skill importer for GitHub repositories.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/woobin-the-creator/skill-hunter
project_urls =
    Repository = https://github.com/woobin-the-creator/skill-hunter
license = MIT
license_files = LICENSE
author = skill-hunter contributors
keywords = agent-skills, claude-code, opencode, codex, ai-agents
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = skill_hunter*

[options.entry_points]
console_scripts =
    skill-hunter = skill_hunter.cli:main
