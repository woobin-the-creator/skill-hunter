name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q skill_hunter scripts
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build and install package
        run: python -m pip install .
      - name: Smoke-test both CLI entrypoints
        run: |
          python scripts/skill_hunter.py --help
          skill-hunter --version
